name: Build & Release macOS DMG + aiv_agent RPM

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v1.2.3

  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  # ─── Job 1: Build aiv_agent Linux binary + RPM ───
  build-agent-rpm:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build aiv_agent Linux binary
        working-directory: aiv_agent
        run: |
          VERSION=${{ steps.version.outputs.version }}
          GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.Version=${VERSION}" \
            -o build/aiv_agent-linux-amd64 ./cmd/aiv_agent

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build RPM
        working-directory: aiv_agent
        run: |
          VERSION=${{ steps.version.outputs.version }}
          RPM_DIR="$(pwd)/build/rpm"

          mkdir -p "$RPM_DIR"/{SOURCES,SPECS,BUILD,RPMS,SRPMS}

          # Copy binary and service file
          cp build/aiv_agent-linux-amd64 "$RPM_DIR/SOURCES/aiv_agent"
          cp packaging/systemd/aiv_agent.service "$RPM_DIR/SOURCES/aiv_agent.service"

          # Create placeholder certs (user will replace with real ones from AI VaultIO)
          mkdir -p "$RPM_DIR/SOURCES"
          touch "$RPM_DIR/SOURCES/ca.crt"
          touch "$RPM_DIR/SOURCES/server.crt"
          touch "$RPM_DIR/SOURCES/server.key"

          # Copy spec
          cp packaging/rpm/aiv_agent.spec "$RPM_DIR/SPECS/"

          # Build RPM
          rpmbuild --define "_topdir $RPM_DIR" \
            --define "_version $VERSION" \
            --define "_sourcedir $RPM_DIR/SOURCES" \
            -bb "$RPM_DIR/SPECS/aiv_agent.spec"

          # Copy RPM to a predictable location
          find "$RPM_DIR/RPMS" -name '*.rpm' -exec cp {} build/ \;
          echo "RPM files:"
          ls -la build/*.rpm

      - name: Upload aiv_agent RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiv-agent-rpm
          path: aiv_agent/build/*.rpm

      - name: Upload aiv_agent binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiv-agent-binary
          path: aiv_agent/build/aiv_agent-linux-amd64

  # ─── Job 2: Build macOS DMG ───
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install protoc
        run: brew install protobuf

      - name: Install dependencies
        run: flutter pub get

      - name: Generate database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build macOS release
        run: flutter build macos --release

      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Code sign (ad-hoc)
        run: |
          APP_PATH="build/macos/Build/Products/Release/AI VaultIO.app"
          codesign --force --deep --sign - "$APP_PATH"
          xattr -cr "$APP_PATH"

      - name: Create DMG
        run: |
          APP_NAME="AI VaultIO"
          DMG_NAME="AI-VaultIO-macOS-v${{ steps.version.outputs.version }}"
          BUILD_DIR="build/macos/Build/Products/Release"

          mkdir -p build/dmg/staging
          cp -R "$BUILD_DIR/$APP_NAME.app" build/dmg/staging/
          ln -s /Applications build/dmg/staging/Applications

          # Install create-dmg for a polished installer
          brew install create-dmg || true

          if command -v create-dmg &> /dev/null; then
            create-dmg \
              --volname "$APP_NAME" \
              --volicon "$BUILD_DIR/$APP_NAME.app/Contents/Resources/AppIcon.icns" \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 100 \
              --icon "$APP_NAME.app" 150 185 \
              --icon "Applications" 450 185 \
              --hide-extension "$APP_NAME.app" \
              --app-drop-link 450 185 \
              "build/dmg/$DMG_NAME.dmg" \
              build/dmg/staging/ || \
            # Fallback if create-dmg fails (e.g., no window server)
            hdiutil create \
              -volname "$APP_NAME" \
              -srcfolder build/dmg/staging \
              -ov -format UDZO \
              "build/dmg/$DMG_NAME.dmg"
          else
            hdiutil create \
              -volname "$APP_NAME" \
              -srcfolder build/dmg/staging \
              -ov -format UDZO \
              "build/dmg/$DMG_NAME.dmg"
          fi

          rm -rf build/dmg/staging

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-VaultIO-macOS
          path: build/dmg/*.dmg

  # ─── Job 3: Create GitHub Release with all artifacts ───
  release:
    needs: [build-macos, build-agent-rpm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download macOS DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: AI-VaultIO-macOS
          path: release-assets/

      - name: Download aiv_agent RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: aiv-agent-rpm
          path: release-assets/

      - name: Download aiv_agent binary artifact
        uses: actions/download-artifact@v4
        with:
          name: aiv-agent-binary
          path: release-assets/

      - name: List release assets
        run: ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AI VaultIO ${{ steps.version.outputs.version }}
          body: |
            ## AI VaultIO ${{ steps.version.outputs.version }}

            ### macOS App Installation
            1. Download `AI-VaultIO-macOS-v${{ steps.version.outputs.version }}.dmg` below
            2. Open the `.dmg` file
            3. Drag **AI VaultIO** to your **Applications** folder
            4. **First launch — bypass Gatekeeper** (app is not notarized):
               - Open **System Settings → Privacy & Security**
               - Scroll down to find _"AI VaultIO" was blocked_ and click **Open Anyway**
               - Or run in Terminal: `xattr -cr /Applications/AI\ VaultIO.app`

            ### aiv_agent (Remote Server Monitoring)
            Install the agent on your Linux servers to monitor them from AI VaultIO.

            **RPM (RHEL/CentOS/Fedora/Amazon Linux):**
            ```bash
            sudo rpm -i aiv_agent-${{ steps.version.outputs.version }}-1.x86_64.rpm
            ```

            **Standalone binary:**
            ```bash
            sudo cp aiv_agent-linux-amd64 /usr/local/bin/aiv_agent
            sudo chmod +x /usr/local/bin/aiv_agent
            ```

            **After installing:**
            1. Open AI VaultIO → Settings → Server Management
            2. Click **Generate Certificates**
            3. Copy the server certificates (`ca.crt`, `server.crt`, `server.key`) to `/etc/aiv_agent/` on your server
            4. Start/restart the agent: `sudo systemctl restart aiv_agent`
            5. Add the server in AI VaultIO and view live metrics

            ### Prerequisites
            - macOS 12+ (Monterey or later)
            - [Ollama](https://ollama.com) installed for AI chat features
            - Linux server with systemd for aiv_agent

            ---
            _Built with Flutter & Ollama — 100% local, 100% private._
          files: release-assets/*
          draft: false
          prerelease: false
