# flutter_rust_bridge v2 configuration (tested with 2.12.x)
# Docs: https://cjycode.com/flutter_rust_bridge/

# Rust module path — FRB scans all pub items in crate::api
rust_input: "crate::api"

# Path to the Rust crate root (where Cargo.toml lives)
rust_root: "rust"

# Where to emit generated Dart bindings
dart_output: "lib/src/rust"

# Disable web target (LanceDB is native-only)
web: false
